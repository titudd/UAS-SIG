<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Kesesuaian Pemukiman Kabupaten Malang</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background-image: url('assets/Bromo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }

        header {
            position: relative;
            background-color: rgba(0, 0, 0, 0.55);
            padding: 20px 40px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .logo-left {
            position: absolute;
            top: 15px;
            left: 20px;
        }

        .logo-left img {
            width: 80px;
            height: auto;
            border-radius: 10px;
            box-shadow: 1px 1px 8px rgba(0,0,0,0.5);
        }

        .kelompok {
            position: absolute;
            top: 15px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            color: #333;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 1px 1px 10px rgba(0,0,0,0.2);
            text-align: left;
            font-size: 14px;
        }

        .kelompok strong {
            display: block;
            margin-bottom: 5px;
            color: #4CAF50;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .peta-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-width: 1000px;
            width: 95%;
        }

        .peta-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 22px;
            }

            .logo-left img {
                width: 60px;
            }

            .kelompok {
                font-size: 13px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Peta Kesesuaian Pemukiman Kabupaten Malang</h1>

        <div class="logo-left">
            <img src="assets/Logo_Malang.png" alt="Logo Kabupaten Malang">
        </div>

        <div class="kelompok">
            <strong>Anggota Kelompok:</strong>
            <ul>
                <li>Anggota 1: Tadeo Laudatte</li>
                <li>Anggota 2: Ryan Dhammaviriya Christy</li>
                <li>Anggota 3: Titus Albert Kristian</li>
            </ul>
        </div>
    </header>

    <main>
        <div class="peta-card">
            <img src="assets/Malang.png" alt="Peta Kabupaten Malang">
        </div>
    </main>
</body>

</html>
