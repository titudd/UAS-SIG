<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Kesesuaian Pemukiman Kabupaten Malang</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background-image: url('assets/Bromo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }

        header {
            position: relative;
            background-color: rgba(0, 0, 0, 0.55);
            padding: 20px 40px 40px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .logo-left {
            position: absolute;
            top: 15px;
            left: 20px;
        }

        .logo-left img {
            width: 80px;
            border-radius: 10px;
        }

        .kelompok-wrapper {
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .kelompok {
            background-color: rgba(255, 255, 255, 0.85);
            color: #333;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .kelompok strong {
            display: block;
            margin-bottom: 5px;
            color: #4CAF50;
        }

        main {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .peta-card {
            background-color: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            max-width: 1000px;
            width: 95%;
        }

        .peta-card img {
            width: 100%;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 20px;
                margin-top: 10px;
            }

            .logo-left {
                position: static;
                text-align: center;
                margin-bottom: 10px;
            }

            .kelompok-wrapper {
                position: static;
                margin-top: 15px;
                display: flex;
                justify-content: center;
            }

            .kelompok {
                max-width: 400px;
                width: 100%;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo-left">
        <img src="assets/Logo_Malang.png" alt="Logo Kabupaten Malang">
    </div>

    <h1>Peta Kesesuaian Pemukiman Kabupaten Malang</h1>

    <div class="kelompok-wrapper">
        <div class="kelompok">
            <strong>Anggota Kelompok:</strong>
            <ul>
                <li>Anggota 1: Tadeo Laudatte</li>
                <li>Anggota 2: Ryan Dhammaviriya Christy</li>
                <li>Anggota 3: Titus Albert Kristian</li>
            </ul>
        </div>
    </div>
</header>

<main>
    <div class="peta-card">
        <img src="assets/Malang.png" alt="Peta Kabupaten Malang">
    </div>
</main>

</body>
</html>
